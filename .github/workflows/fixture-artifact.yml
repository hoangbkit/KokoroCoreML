name: Executable fixture artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Matching package version (e.g. 1.1.0); no tag is created
        required: true
        type: string
      validate:
        description: Explicitly run static inspection and macOS runtime tests
        type: boolean
        default: false
      production_revision:
        description: Exact 40-character HF artifact revision for production-spec parity (required to publish)
        type: string
        default: ''
      publish:
        description: Attach generated artifacts to an existing matching GitHub release (select its tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-15
    steps:
      - name: Require release gates before publication
        if: inputs.publish
        env:
          RUN_VALIDATION: ${{ inputs.validate }}
          PRODUCTION_REVISION: ${{ inputs.production_revision }}
        run: |
          test "$RUN_VALIDATION" = true
          test -n "$PRODUCTION_REVISION"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/fixtures/requirements.txt
      - name: Install pinned generator dependencies
        run: python -m pip install -r scripts/fixtures/requirements.txt
      - name: Generate from the selected ref
        env:
          FIXTURE_VERSION: ${{ inputs.version }}
        run: python scripts/fixtures/generate.py --version "$FIXTURE_VERSION" --output "$RUNNER_TEMP/fixture-build/kokoro"
      - name: Inspect generated contracts when explicitly requested
        if: inputs.validate
        run: python scripts/fixtures/inspect_contract.py --bundle "$RUNNER_TEMP/fixture-build/kokoro" --report "$RUNNER_TEMP/fixture-build/kokoro/ContractInspection.json"
      - name: Compare actual pinned production specifications
        if: inputs.validate && inputs.production_revision != ''
        env:
          PRODUCTION_REVISION: ${{ inputs.production_revision }}
        run: |
          python scripts/fixtures/download_specs.py --revision "$PRODUCTION_REVISION" --output "$RUNNER_TEMP/production-specs"
          python scripts/fixtures/inspect_contract.py --bundle "$RUNNER_TEMP/fixture-build/kokoro" --production-specs "$RUNNER_TEMP/production-specs" --production-revision "$PRODUCTION_REVISION" --report "$RUNNER_TEMP/fixture-build/kokoro/ProductionContractInspection.json"
      - name: Run focused runtime validation when explicitly requested
        if: inputs.validate
        env:
          KOKORO_EXECUTABLE_FIXTURE_ROOT: ${{ runner.temp }}/fixture-build/kokoro
        run: swift test --filter ExecutableFixtureTests
      - name: Package versioned fixture
        run: python scripts/fixtures/package.py --bundle "$RUNNER_TEMP/fixture-build/kokoro" --output-directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-executable-fixture
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require the selected ref to be the matching existing tag
        env:
          SELECTED_REF_TYPE: ${{ github.ref_type }}
          SELECTED_REF_NAME: ${{ github.ref_name }}
          FIXTURE_VERSION: ${{ inputs.version }}
        run: |
          test "$SELECTED_REF_TYPE" = tag
          test "$SELECTED_REF_NAME" = "$FIXTURE_VERSION" || test "$SELECTED_REF_NAME" = "v$FIXTURE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: kokoro-executable-fixture
          path: dist
      - name: Attach to the existing release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIXTURE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$FIXTURE_TAG"
          gh release upload "$FIXTURE_TAG" dist/*
